# XcodeGen project definition. Regenerate the Xcode project with:  cd ios && xcodegen generate
name: JellyFloat
options:
  bundleIdPrefix: at.guggug
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
targets:
  JellyFloat:
    type: application
    platform: iOS
    sources:
      - path: JellyFloat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: at.guggug.jellyfloat
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: JellyFloat/Info.plist
      properties:
        CFBundleDisplayName: JellyFloat
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        NSLocalNetworkUsageDescription: JellyFloat talks to your jellyfish over the local Wi-Fi network.
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: JellyFloat/JellyFloat.entitlements
      properties:
        com.apple.developer.networking.HotspotConfiguration: true
