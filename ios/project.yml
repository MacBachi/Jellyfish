# XcodeGen project definition. Regenerate the Xcode project with:  cd ios && xcodegen generate
name: JellyFloat
options:
  bundleIdPrefix: at.guggug
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic
targets:
  JellyFloat:
    type: application
    platform: iOS
    sources:
      - path: JellyFloat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: at.guggug.jellyfloat
        # iPhone only. On the target, not just the project: the target's own default is
        # "1,2", and an app that claims iPad needs iPad screenshots and all orientations.
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_FILE: Generated/Info.plist
    # Info.plist: Info.template.plist is the template (hand-maintained, with __VERSION__,
    # __BUILD__ and __GITREV__ placeholders); scripts/gen-build-info.sh fills it in from
    # ../VERSION and git before every build, into Generated/Info.plist.
    entitlements:
      path: JellyFloat/JellyFloat.entitlements
      properties:
        com.apple.developer.networking.HotspotConfiguration: true
    preBuildScripts:
      - name: Generate Info.plist with version
        script: '"$SRCROOT/scripts/gen-build-info.sh"'
        inputFiles:
          - $(SRCROOT)/../VERSION
          - $(SRCROOT)/Info.template.plist
        outputFiles:
          - $(SRCROOT)/Generated/Info.plist
        basedOnDependencyAnalysis: false
