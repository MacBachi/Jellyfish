; Power board: an ESP32 8-relay board that switches the USB supply of up to eight jellies.
; Build:   pio run -d powerboard
; Flash:   hold IO0, tap EN, release IO0 (the board has no auto-reset), then
;          pio run -d powerboard -t upload --upload-port /dev/cu.usbserial-XXXX
;          and tap EN once more to start the new firmware.
[env:relay8]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.embed_txtfiles = web/index.html
build_flags = -DPOWER_VERSION=\"1.0.0\"
