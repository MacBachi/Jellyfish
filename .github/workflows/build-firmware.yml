name: Build firmware

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add Pico SDK import helper
        run: cp .github/pico_sdk_import.cmake firmware_cpp/pico_sdk_import.cmake

      - uses: samyarsadat/Pico-Build-Action@v1
        with:
          source_dir: firmware_cpp
          output_dir: build

      - uses: actions/upload-artifact@v4
        with:
          name: JellyFloatOS
          path: firmware_cpp/build/JellyFloatOS.uf2

  # A release is a deliberate act: push a tag like v0.1.0 and this job publishes the
  # firmware built from exactly that commit.
  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download firmware
        uses: actions/download-artifact@v4
        with:
          name: JellyFloatOS
          path: release-files

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-files/JellyFloatOS.uf2 \
            --repo "$GITHUB_REPOSITORY" \
            --title "JellyFloatOS $GITHUB_REF_NAME" \
            --generate-notes
