name: Build firmware

on:
  push:
  pull_request:
  # "Run workflow" in the Actions tab builds a variant for a specific jelly.
  workflow_dispatch:
    inputs:
      ring_leds:
        description: "LEDs in the ring (empty = default 96)"
        required: false
        default: ""
      ring_order:
        description: "Ring colour order: RGB, RBG, GRB, GBR, BRG, BGR (empty = default RGB)"
        required: false
        default: ""
      tentacle_order:
        description: "Tentacle colour order (empty = default RGB)"
        required: false
        default: ""
      wifi_ssid:
        description: "Network name (empty = default)"
        required: false
        default: ""
      wifi_password:
        description: "Network password, 8+ characters (empty = default)"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add Pico SDK import helper
        run: cp .github/pico_sdk_import.cmake firmware_cpp/pico_sdk_import.cmake

      - name: Collect build options
        id: opts
        env:
          RING: ${{ inputs.ring_leds }}
          RING_ORDER: ${{ inputs.ring_order }}
          TENTACLE_ORDER: ${{ inputs.tentacle_order }}
          SSID: ${{ inputs.wifi_ssid }}
          PASSWORD: ${{ inputs.wifi_password }}
        run: |
          args=""
          suffix=""
          [ -n "$RING" ] && args="$args -DJELL_RING_LEDS=$RING" && suffix="$suffix-ring$RING"
          [ -n "$RING_ORDER" ] && args="$args -DJELL_RING_ORDER=$RING_ORDER" && suffix="$suffix-$RING_ORDER"
          [ -n "$TENTACLE_ORDER" ] && args="$args -DJELL_TENTACLE_ORDER=$TENTACLE_ORDER" && suffix="$suffix-t$TENTACLE_ORDER"
          [ -n "$SSID" ] && args="$args -DJELL_WIFI_SSID=$SSID" && suffix="$suffix-custom-wifi"
          [ -n "$PASSWORD" ] && args="$args -DJELL_WIFI_PASSWORD=$PASSWORD"
          echo "args=$args" >> "$GITHUB_OUTPUT"
          echo "suffix=$suffix" >> "$GITHUB_OUTPUT"
          echo "cmake args: $args"

      - uses: samyarsadat/Pico-Build-Action@v1
        with:
          source_dir: firmware_cpp
          output_dir: build
          cmake_args: ${{ steps.opts.outputs.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: JellyFloatOS${{ steps.opts.outputs.suffix }}
          path: firmware_cpp/build/JellyFloatOS.uf2

  # A release is a deliberate act: push a tag like v0.1.0 and this job publishes the
  # firmware built from exactly that commit.
  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download firmware
        uses: actions/download-artifact@v4
        with:
          name: JellyFloatOS
          path: release-files

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-files/JellyFloatOS.uf2 \
            --repo "$GITHUB_REPOSITORY" \
            --title "JellyFloatOS $GITHUB_REF_NAME" \
            --generate-notes
